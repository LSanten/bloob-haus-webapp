# Bloob Haus Site Config — marbles
# Infrastructure settings only. Author settings live in _bloob-settings.md in the vault.

# Deployed URL (webapp infra — Cloudflare)
site:
  url: "https://leons.bloob.haus"

# Content source (webapp infra — GitHub)
content:
  repo: "LSanten/bloob-haus-marbles"
  branch: "main"

# URL slug strategy: preserve-case keeps original filename casing, spaces → hyphens
permalinks:
  strategy: preserve-case

# Build features
features:
  search: true   # Pagefind search index — enables search bar on homepage
  # Load only the visualizer CSS/JS a page actually uses (TECH-DEBT #4).
  # Verified with: node scripts/audit-visualizer-detection.js --src=src-leons
  per_page_visualizers: true
  magic_machines: true
  # yes = sitemap.xml + robots.txt hand search engines every listed page | quiet (default)
  # = no sitemap | no = every page says noindex. Unlisted pages are never listed.
  show_in_search: yes
  # Inline #tags become links to their tag page where they were written; the page's foot then
  # shows the frontmatter tags only (scripts/utils/inline-tags.js)
  inline_tag_links: true
  date_from_filename: true   # legacy: date stays in URL — the vault's url.date_prefix: keep wins anyway
