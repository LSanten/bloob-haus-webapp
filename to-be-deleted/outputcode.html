    pill.id = 'bloob-filter-pill';
    pill.setAttribute('role', 'status');
    pill.setAttribute('aria-live', 'polite');
    pill.style.cssText = [
      'position:fixed',
      'bottom:28px',
      'left:50%',
      'transform:translateX(-50%) translateY(100px)',
      'background:' + BLUE_BG,
      'backdrop-filter:blur(14px)',
      '-webkit-backdrop-filter:blur(14px)',
      'border:1.5px solid ' + BLUE_BORDER,
      'color:#111111',
      'padding:12px 24px',
      'border-radius:9999px',
      'font-family:system-ui,sans-serif',
      'font-size:14px',
      'font-weight:600',
      'letter-spacing:0.01em',
      'z-index:9999',
      'transition:transform 0.5s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s ease, background 0.5s ease, border-color 0.5s ease',
      'opacity:0',
      'pointer-events:none',
      'display:flex',
      'align-items:center',
      'gap:12px',
      'box-shadow:0 -2px 16px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.06)',
      'white-space:nowrap',
      'user-select:none',
      '-webkit-user-select:none',
    ].join(';');
    document.body.appendChild(pill);
  }

  function renderPillContent(count, mode) {
    var matchWord = count === 1 ? 'match' : 'matches';
    var countText = count === 0
      ? (mode === 'and' ? '0 matches \u2014 try fewer filters' : '0 matches')
      : count + '\u00a0' + matchWord;
    var btnBase = 'background:none;border:none;cursor:pointer;font-family:inherit;font-weight:400;padding:0;';
    pill.innerHTML =
      '<span aria-hidden="true" style="font-size:15px">\uD83D\uDC3E</span>' +
      '<span>' + countText + '</span>' +
      '<button style="' + btnBase + 'opacity:0.5;font-size:12px;color:inherit">\u2193\u00a0scroll down</button>' +
      '<span style="opacity:0.2">|</span>' +
      '<button style="' + btnBase + 'opacity:0.4;font-size:12px;color:inherit">\u2715\u00a0clear</button>';
    pill.querySelectorAll('button')[0].addEventListener('click', scrollToProducts);
    pill.querySelectorAll('button')[1].addEventListener('click', clearFilters);
  }

  function showPill(count, mode) {
    createPill();
    renderPillContent(count, mode);

    if (isFirstShow) {
      isFirstShow = false;
      pill.style.transition = 'none';
      pill.style.background = PINK_BG;
      pill.style.borderColor = PINK_BORDER;
      pill.style.transform = 'translateX(-50%) translateY(100px) scale(1.18)';
      pill.style.opacity = '0';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          pill.style.transition = 'transform 0.55s cubic-bezier(0.34,1.4,0.64,1), opacity 0.25s ease, background 0.55s ease, border-color 0.55s ease';
          pill.style.opacity = '1';
          pill.style.transform = 'translateX(-50%) translateY(0) scale(1)';
          pill.style.pointerEvents = 'auto';
          setTimeout(function () {
            pill.style.background = BLUE_BG;
            pill.style.borderColor = BLUE_BORDER;
          }, 320);
        });
      });
    } else {
      requestAnimationFrame(function () {
        pill.style.transition = 'transform 0.45s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s ease, background 0.5s ease, border-color 0.5s ease';
        pill.style.opacity = '1';
        pill.style.transform = 'translateX(-50%) translateY(0) scale(1)';
        pill.style.pointerEvents = 'auto';
      });
    }
  }

  function hidePill() {
    if (!pill) return;
    pill.style.opacity = '0';
    pill.style.transform = 'translateX(-50%) translateY(100px) scale(1)';
    pill.style.pointerEvents = 'none';
    isFirstShow = true;
  }

  function countVisible() {
    var count = 0;
    document.querySelectorAll('[data-tags]').forEach(function (item) {
      if (item.style.display !== 'none') count++;
    });
    return count;
  }

  window.addEventListener('bloob:filter', function (e) {
    var tags = (e.detail && e.detail.tags) ? e.detail.tags : [];
    var mode = (e.detail && e.detail.mode) ? e.detail.mode : 'or';
    if (tags.length === 0) { hidePill(); return; }
    requestAnimationFrame(function () { showPill(countVisible(), mode); });
  });
})();
</script>
