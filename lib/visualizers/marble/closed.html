<button class="marble-ball" type="button" data-bloob-toggle aria-label="Open or close this marble" data-color="{{ color }}" data-image="{{ image }}">
  <img class="marble-ball__picture no-optimize" src="{{ yaml.closed_picture }}" alt="" width="256" height="256" data-bloob-picture>
</button>
<p class="marble-title">{{ title }}</p>
<p class="marble-subtitle">{{ subtitle }}</p>
<p class="marble-hint" aria-hidden="true"><span class="marble-hint__click">Click the marble to open it</span><span class="marble-hint__tap">Tap the marble to open it</span></p>
<details class="marble-about" data-pagefind-ignore>
  <summary>What is a {{ yaml.object_label }}?</summary>
  <p>{{ yaml.object_about }}</p>
</details>
