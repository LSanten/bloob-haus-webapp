# Bloob Haus Site Config — melt
# Infrastructure settings only. Author settings live in _bloob-settings.md in the vault.

# Deployed URL
site:
  url: "https://melt.bloob.haus"

# Content source
content:
  repo: "LSanten/melt-website"
  branch: "main"

# URL slug strategy: preserve-case keeps original filename casing, spaces → hyphens
permalinks:
  strategy: preserve-case

# Build features
features:
  search: true
  # Load only the visualizer CSS/JS a page actually uses (TECH-DEBT #4).
  # Detection reads the rendered HTML; shapes opt in via `detect` in their
  # manifest.json, and anything unannotated is still loaded everywhere.
  per_page_visualizers: true
