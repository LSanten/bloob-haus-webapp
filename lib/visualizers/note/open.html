<div class="note-paper">
  <div class="note-text">
    <h1 class="note-title">{{ title }}</h1>
    {{ body }}
  </div>
  <button class="note-tip" type="button" data-bloob-toggle aria-label="Unroll this note"></button>
</div>
<button class="note-roll" type="button" data-bloob-toggle aria-label="Unroll or roll up this note"></button>
